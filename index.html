<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteigleiterCheck</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div>
        <h1>🪜 SteigleiterCheck</h1>
        <p>IndustryServiceHuber</p>
    </div>
</header>

<main>
    <section class="search">
        <input id="search" type="text" placeholder="Steigleiter suchen...">
    </section>

    <section id="cards"></section>
</main>

<template id="leiter-template">
    <div class="leiter-card">
        <div class="status"></div>
        <div class="content">
            <h2 class="nummer"></h2>
            <p class="kunde"></p>
            <p class="standort"></p>
            <div class="details">
                <span class="hersteller"></span>
                <span class="baujahr"></span>
                <span class="hoehe"></span>
                <span class="sprossen"></span>
            </div>
        </div>
        <div class="arrow">➜</div>
    </div>
</template>

<script src="app.js"></script>
</body>

</html>
